name: Deploy Şərq Soft (sarqsoft) to GitHub Pages

# Builds the Next.js static export in sarqsoft/ and publishes it to GitHub
# Pages — free hosting. Served at https://<owner>.github.io/site/ (basePath
# "/site"); set NEXT_PUBLIC_BASE_PATH to "" when moving to the sarqsoft.az
# custom domain.

on:
  push:
    branches: [main, claude/gallant-lamport-kf4f7e]
    paths:
      - 'sarqsoft/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sarqsoft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sarqsoft/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sarqsoft/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
